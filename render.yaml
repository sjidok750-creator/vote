# Render 배포 설정 (Blueprint)
# https://render.com 에서 New > Blueprint 로 이 저장소를 연결하면 자동 적용됩니다.
# 무료 플랜은 영구 디스크를 지원하지 않으므로, 무료 PostgreSQL 데이터베이스를 사용합니다.
services:
  - type: web
    name: votesecret
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: votesecret-db
          property: connectionString # DB 접속 주소 자동 주입
      - key: VOTE_SALT
        generateValue: true # 임의의 안전한 값 자동 생성

databases:
  - name: votesecret-db
    plan: free
