# Render 배포 설정 (Blueprint)
# https://render.com 에서 New > Blueprint 로 이 저장소를 연결하면 자동 적용됩니다.
services:
  - type: web
    name: votesecret
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        value: file:/data/prod.db
      - key: VOTE_SALT
        generateValue: true # 임의의 안전한 값 자동 생성
    disk:
      name: votesecret-data
      mountPath: /data # SQLite 데이터 영구 보존
      sizeGB: 1
